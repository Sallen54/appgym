name: Publicar APK

# Se dispara al crear una etiqueta tipo v1.1, y también a mano desde la web.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # El proyecto no trae gradlew, así que el runner instala Gradle él mismo.
          gradle-version: '8.9'
          cache-read-only: false

      - name: Calcular la versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NOMBRE="${{ inputs.version }}"
          else
            NOMBRE="${GITHUB_REF_NAME#v}"
          fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          # El código de versión debe subir siempre; el número de ejecución sirve.
          echo "codigo=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Versión $NOMBRE (código ${GITHUB_RUN_NUMBER})"

      - name: Limpiar esquemas de Room
        # Evita que un esquema a medias de otra ejecución rompa la compilación.
        run: rm -rf app/schemas

      - name: Pasar los tests
        # Solo la variante debug: "test" compila también release, y las dos
        # exportan el esquema de Room al mismo sitio y se pisan.
        run: gradle testDebugUnitTest --stacktrace

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sin él la app no se puede instalar."
            exit 1
          fi

          # Al pegar el secreto se cuelan saltos de línea, retornos de carro o
          # espacios. base64 los rechaza, así que se limpian antes de decodificar.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/firma.jks" 2>/dev/null || {
            echo "::error::El secreto KEYSTORE_BASE64 no es base64 válido."
            echo "Vuelve a generarlo en PowerShell con:"
            echo '  [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore")) | Set-Clipboard'
            echo "y pégalo entero, sin añadir saltos de línea."
            exit 1
          }

          TAM=$(stat -c%s "$RUNNER_TEMP/firma.jks")
          echo "Clave restaurada: $TAM bytes"
          if [ "$TAM" -lt 500 ]; then
            echo "::error::La clave restaurada es demasiado pequeña ($TAM bytes); el secreto está incompleto."
            exit 1
          fi

          # Comprobar que es un almacén de claves de verdad y que el alias existe.
          keytool -list -keystore "$RUNNER_TEMP/firma.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" > /dev/null || {
            echo "::error::La clave no se puede abrir. Revisa KEYSTORE_PASSWORD (android) y KEY_ALIAS (androiddebugkey)."
            exit 1
          }
          echo "Alias encontrado y contraseña correcta."

      - name: Compilar el APK firmado
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.nombre }}
          APP_VERSION_CODE: ${{ steps.version.outputs.codigo }}
          KEYSTORE_PATH: ${{ runner.temp }}/firma.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Renombrar y comprobar que el APK va firmado
        run: |
          ORIGINAL=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$ORIGINAL" ]; then
            echo "::error::No se generó ningún APK."
            exit 1
          fi
          APK="app/build/outputs/apk/release/appgym-${{ steps.version.outputs.nombre }}.apk"
          mv "$ORIGINAL" "$APK"
          echo "APK: $APK"

          # apksigner vive en una versión de build-tools que cambia según el runner.
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -r | head -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK"
          else
            echo "::warning::No encuentro apksigner; compruebo solo que el APK lleva firma."
            unzip -l "$APK" | grep -q "META-INF/.*\.RSA" || {
              echo "::error::El APK no está firmado: no se podría instalar."
              exit 1
            }
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Borrar la clave del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.nombre) || github.ref_name }}
          name: AppGym ${{ steps.version.outputs.nombre }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          body: |
            Versión ${{ steps.version.outputs.nombre }}

            Descarga el APK de abajo e instálalo encima de la versión anterior.
            Tus entrenamientos se conservan.
